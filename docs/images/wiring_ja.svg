<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" role="img" aria-label="KeyRelay 机上ユニットの配線（USB-Aキー、USB給電）"><style>
  .band{fill:#1d2124}.blk{fill:#fff;stroke:#1d2124;stroke-width:1.4}.blk.opt{stroke:#8b8f8a;stroke-dasharray:5 4}
  .dot{stroke:none}.dot.gnd{fill:#2a2e31}.dot.v5{fill:#c62f2f}
  .w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .v5{stroke:#c62f2f}.gnd{stroke:#2a2e31}.dp{stroke:#2e8b57}.dm{stroke:#8a96a3}.tx{stroke:#2f6fd1}.rx{stroke:#8a4fd1}
  .key{fill:#1d2124}.part{fill:#fff;stroke:#1d2124;stroke-width:1.3}
  text{font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;fill:#1d2124}
  .lbl{font-size:13px;font-weight:700}.sub{font-size:11.5px;fill:#5f6669}
  .mono,.pin{font-family:ui-monospace,Menlo,"DejaVu Sans Mono",monospace}.mono{font-size:12px}.pin{font-size:11.5px}
</style><rect width="100%" height="100%" fill="#f6f6f3"/>
          <defs>
            <g id="g">
              <path d="M-12 0 H12 M-8 5 H8 M-4 10 H4" style="stroke:#2a2e31;stroke-width:2.4;fill:none;stroke-linecap:round"/>
            </g>
          </defs>

          
          <rect class="blk opt" x="24" y="78" width="150" height="112" rx="8"/>
          <text class="lbl" x="38" y="104">USB充電器 / PC</text>
          <text class="sub" x="38" y="122">充電器: 電源だけ</text>
          <text class="sub" x="38" y="140">PC: 電源＋ログ</text>
          <text class="sub" x="38" y="170">USB-Cケーブル</text>
          <path d="M174 134 H214" style="stroke:#1d2124;stroke-width:7;stroke-linecap:round"/>

          
          <rect class="blk" x="214" y="60" width="200" height="190" rx="8"/>
          <text class="lbl" x="228" y="86">USB-UART変換</text>
          <text class="sub" x="228" y="102">CP2102N（背面の穴にUSB-C）</text>
          <rect class="part" x="214" y="120" width="26" height="30" rx="6"/>
          <text class="pin" x="344" y="140">5V ▶</text>
          <text class="pin" x="336" y="180">GND ▶</text>
          <text class="pin" x="336" y="212">TXD ▶</text>
          <text class="pin" x="336" y="236">RXD ▶</text>

          
          <path class="w v5" d="M414 136 H470"/>
          <polygon class="part" points="470,122 470,150 494,136"/>
          <rect class="band" x="494" y="122" width="5" height="28"/>
          <text class="mono" x="420" y="112">D1 ダイオード 1N5819</text>
          <text class="sub" x="440" y="170">帯＝XIAO側</text>
          <path class="w v5" d="M499 136 H870"/>
          <circle class="dot v5" cx="780" cy="136" r="4"/>

          
          <path class="w gnd" d="M414 176 H870"/>
          <circle class="dot gnd" cx="780" cy="176" r="4"/>

          
          <path class="w v5" d="M780 136 V148"/>
          <rect class="part" x="764" y="148" width="32" height="7" rx="2"/>
          <rect class="part" x="764" y="159" width="32" height="7" rx="2"/>
          <path class="w gnd" d="M780 166 V176"/>
          <text class="pin" x="800" y="156" style="font-size:10px">＋</text>
