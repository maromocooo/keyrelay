name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mbedtls
        run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - name: Host unit tests (fragmentation, link security, bond policy, OTP batching, keyboard filter)
        run: make -C firmware/tests/host

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang, libFuzzer and mbedtls
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev libmbedtls-dev
      - name: Fuzz the link input (HELLO, X25519, AES-GCM + padding) and the fragment reassembly
        run: make -C firmware/tests/fuzz run CC=clang-18 FUZZ_SECONDS=60

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: receiver
            variant: default
          - project: desk_unit
            variant: default
          # Compile checks of the build options
          - project: desk_unit
            variant: uart-download
          - project: receiver
            variant: no-keyboard
          - project: desk_unit
            variant: log-ja
          - project: receiver
            variant: log-ja
          - project: desk_unit
            variant: hardened
          - project: receiver
            variant: hardened
    # Compile check only. No firmware is published: the default build uses the pid.codes test PID
    # 0x1209:0x0001, which must not be distributed. Build from source (docs/BUILD.md).
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          cd "firmware/${{ matrix.project }}"
          if [ "${{ matrix.variant }}" = "uart-download" ]; then
            sed -i 's/^#define YD_UART_DOWNLOAD_CMD 0/#define YD_UART_DOWNLOAD_CMD 1/' main/main.c
            grep -q '^#define YD_UART_DOWNLOAD_CMD 1' main/main.c
          fi
          if [ "${{ matrix.variant }}" = "no-keyboard" ]; then
            echo "CONFIG_YD_OTP_KEYBOARD=n" >> sdkconfig.defaults
          fi
          if [ "${{ matrix.variant }}" = "log-ja" ]; then
            echo "CONFIG_YD_LOG_LANG_JA=y" >> sdkconfig.defaults
          fi
          if [ "${{ matrix.variant }}" = "hardened" ]; then
            cat ../hardening/sdkconfig.hardened >> sdkconfig.defaults   # docs/HARDENING.md
          fi
          idf.py set-target esp32s3
          idf.py build merge-bin -o "keyrelay_${{ matrix.project }}_full.bin"
