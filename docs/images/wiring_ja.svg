          <text class="pin" x="878" y="412">◀ VBUS</text>
          <text class="pin" x="878" y="434">◀ GND</text>
          <text class="pin" x="878" y="456">◀ D+</text>
          <text class="pin" x="878" y="478">◀ D-</text>
          <text class="pin" x="960" y="478" style="fill:#5f6669">CC1 空き</text>

          
          <rect class="blk" x="560" y="352" width="160" height="148" rx="8"/>
          <text class="lbl" x="574" y="375">USB-Aメス基板</text>
          <text class="sub" x="574" y="391">（ホットボンドで固定）</text>
          <text class="pin" x="650" y="412">VBUS ▶</text>
          <text class="pin" x="664" y="434">GND ▶</text>
          <text class="pin" x="672" y="456">D+ ▶</text>
          <text class="pin" x="672" y="478">D- ▶</text>
          <path class="w v5" d="M720 408 H870"/>
          <path class="w gnd" d="M720 430 H870"/>
          <path class="w dp" d="M720 452 H870"/>
          <path class="w dm" d="M720 474 H870"/>

          
          <rect class="part" x="440" y="402" width="120" height="70" rx="3"/>
          <text class="sub" x="452" y="442">レセプタクル</text>
          <rect class="key" x="300" y="396" width="146" height="82" rx="9"/>
          <circle cx="342" cy="437" r="15" style="fill:#c9a227"/>
          <circle cx="314" cy="437" r="5.5" style="fill:#ffffff"/>
          <text class="lbl" x="372" y="432" style="fill:#f6f6f3;font-size:12px">キー</text>
          <text x="372" y="449" style="fill:#f6f6f3;font-size:11px">USB-A</text>
          <text class="sub" x="300" y="498">ケース左側面のスロットから挿す</text>

          <text class="sub" x="24" y="300">キーの電源（VBUS）は、XIAOの5Vから</text>
          <text class="sub" x="24" y="318">XIAOのUSB-C → プラグ基板を通って届く</text>
        </svg>