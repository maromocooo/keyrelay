          <path d="M953 326 V350" style="stroke:#1d2124;stroke-width:7;stroke-linecap:round"/>
          <rect class="blk" x="870" y="350" width="166" height="150" rx="8"/>
          <text class="lbl" x="884" y="374">USB-Cプラグ基板</text>
