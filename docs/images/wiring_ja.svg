          <text class="pin" x="878" y="290">◀ D6 GPIO43 TX</text>
          <text class="pin" x="960" y="222" style="fill:#5f6669">U.FL ▶</text>
          <path d="M1036 218 H1050 V40 H900" style="stroke:#5f6669;stroke-width:2;fill:none"/>
          <rect class="part" x="760" y="28" width="140" height="24" rx="4"/>
